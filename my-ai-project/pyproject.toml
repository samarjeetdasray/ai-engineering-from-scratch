[project]
name = "my-ai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samarjeet Das Ray", email = "Samarjeet.dasray@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "torch>=2.14.1",
]

[project.scripts]
my-ai-project = "my_ai_project:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
llm = ["anthropic>=0.39", "openai>=1.50"]
dev = ["pytest>=8.0", "ruff>=0.5"]
